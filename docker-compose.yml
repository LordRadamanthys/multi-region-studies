name: multi-region

# Two "regions" (a, b) with the same pieces: Go service + Postgres + Redpanda (Kafka API).
#   region-a / region-b : private network of each region
#   wan                 : the only link between regions (service<->other region's Kafka). Cut it = network partition
#   edge                : clients, global router (HAProxy), Prometheus, Grafana, k6

x-postgres: &postgres
  image: postgres:16-alpine
  environment:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
    POSTGRES_DB: customers
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U app -d customers"]
    interval: 2s
    timeout: 2s
    retries: 20

x-redpanda: &redpanda
  image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
  healthcheck:
    test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
    interval: 3s
    timeout: 3s
    retries: 30
    start_period: 5s

x-service: &service
  image: mr-customer-service
  restart: unless-stopped
  environment: &service-env
    HTTP_ADDR: ":8080"
    HEALTH_REQUIRE_KAFKA: ${HEALTH_REQUIRE_KAFKA:-false}
    RELAY_INTERVAL: 2s

services:
  # ------------------------------ REGION A ------------------------------
  postgres-a:
    <<: *postgres
    container_name: mr-postgres-a
    hostname: postgres-a
    # Phase 5: enable streaming replication toward postgres-b.
    # hot_standby lets the replica serve read-only queries.
    # synchronous_commit and synchronous_standby_names are left at defaults (async)
    # and can be changed at runtime via chaos.sh pg-sync-on / pg-sync-off.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - wal_keep_size=128MB
      - -c
      - hot_standby=on
    volumes:
      - postgres-a-data:/var/lib/postgresql/data
      - ./infra/postgres/primary/init.sh:/docker-entrypoint-initdb.d/01-replication.sh:ro
    networks: [region-a, wan]

  redpanda-a:
    <<: *redpanda
    container_name: mr-redpanda-a
    hostname: redpanda-a
    command:
      - redpanda start
      - --kafka-addr internal://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda-a:9092
      - --mode dev-container
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --default-log-level=warn
    volumes: [redpanda-a-data:/var/lib/redpanda/data]
    networks: [region-a, wan]

  redpanda-init-a:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    container_name: mr-redpanda-init-a
    depends_on:
      redpanda-a: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command: ["rpk -X brokers=redpanda-a:9092 topic create a.customers -p 3 -r 1 || true"]
    restart: "no"
    networks: [region-a]

  service-a:
    <<: *service
    build: .                     # service-b reuses this image (building it twice in parallel collides)
    container_name: mr-service-a
    hostname: service-a
    environment:
      <<: *service-env
      REGION: a
      # Phase 5: multi-host DSN so pgx finds the read-write primary after a failover.
      DATABASE_URL: postgres://app:app@postgres-a,postgres-b/customers?sslmode=disable&target_session_attrs=read-write
      KAFKA_BROKERS: redpanda-a:9092
      KAFKA_TOPIC: a.customers
      REMOTE_KAFKA_BROKERS: redpanda-b:9092
      REMOTE_KAFKA_TOPIC: b.customers
    ports: ["18081:8080"]
    depends_on:
      postgres-a: {condition: service_healthy}
      redpanda-init-a: {condition: service_completed_successfully}
    networks: [region-a, wan, edge]

  # ------------------------------ REGION B ------------------------------
  # Phase 5: postgres-b is a physical streaming replica of postgres-a.
  # The custom entrypoint runs pg_basebackup on first boot (empty volume) then
  # starts normally. No separate init container → Docker Compose never re-triggers
  # a dependency restart that could accidentally promote the standby.
  postgres-b:
    <<: *postgres
    container_name: mr-postgres-b
    hostname: postgres-b
    entrypoint: ["/bin/sh", "/replica-setup/entrypoint.sh"]
    volumes:
      - postgres-b-data:/var/lib/postgresql/data
      - ./infra/postgres/replica/entrypoint.sh:/replica-setup/entrypoint.sh:ro
    depends_on:
      postgres-a: {condition: service_healthy}
    networks: [region-b, wan]

  redpanda-b:
    <<: *redpanda
    container_name: mr-redpanda-b
    hostname: redpanda-b
    command:
      - redpanda start
      - --kafka-addr internal://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda-b:9092
      - --mode dev-container
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --default-log-level=warn
    volumes: [redpanda-b-data:/var/lib/redpanda/data]
    networks: [region-b, wan]

  redpanda-init-b:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    container_name: mr-redpanda-init-b
    depends_on:
      redpanda-b: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command: ["rpk -X brokers=redpanda-b:9092 topic create b.customers -p 3 -r 1 || true"]
    restart: "no"
    networks: [region-b]

  service-b:
    <<: *service
    container_name: mr-service-b
    hostname: service-b
    environment:
      <<: *service-env
      REGION: b
      # Phase 5: writes go to postgres-a (primary); pgx reconnects to postgres-b if it is promoted.
      DATABASE_URL: postgres://app:app@postgres-a,postgres-b/customers?sslmode=disable&target_session_attrs=read-write
      KAFKA_BROKERS: redpanda-b:9092
      KAFKA_TOPIC: b.customers
      # Phase 5: REMOTE_KAFKA_BROKERS intentionally omitted.
      # Postgres streaming replication replaces the Kafka-based LWW replication path for B.
      # service-a still consumes b.customers (events are skipped as stale – harmless).
    ports: ["18082:8080"]
    depends_on:
      postgres-a: {condition: service_healthy}    # service-b writes go to postgres-a
      postgres-b: {condition: service_healthy}
      redpanda-init-b: {condition: service_completed_successfully}
    networks: [region-b, wan, edge]

  # ------------------------------ GLOBAL ------------------------------
  haproxy:                       # plays the role of Route53 / Global Accelerator + health checks
    image: haproxy:3.0-alpine
    container_name: mr-haproxy
    volumes: ["./infra/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"]
    ports:
      - "8080:8080"              # active-active (round robin over healthy regions)
      - "8090:8090"              # failover (region A primary, region B backup)
      - "8404:8404"              # stats UI + Prometheus metrics
    networks: [edge]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: mr-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver     # k6 pushes its metrics here
      - --storage.tsdb.retention.time=3h
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    networks: [edge]

  grafana:
    image: grafana/grafana:11.3.0
    container_name: mr-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/multi-region.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
    networks: [edge]

  # Phase 5: postgres_exporter instances expose pg_stat_replication, pg_is_in_recovery,
  # and timeline_id so Grafana can show WAL lag, role (PRIMARY/STANDBY), and failover events.
  postgres-exporter-a:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: mr-postgres-exporter-a
    environment:
      DATA_SOURCE_NAME: "postgresql://exporter:exporter@postgres-a:5432/postgres?sslmode=disable"
    command: ["--extend.query-path=/etc/pg-exporter/queries.yaml"]
    volumes:
      - ./infra/postgres/exporter/queries.yaml:/etc/pg-exporter/queries.yaml:ro
    depends_on:
      postgres-a: {condition: service_healthy}
    networks: [region-a, edge]

  postgres-exporter-b:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: mr-postgres-exporter-b
    environment:
      DATA_SOURCE_NAME: "postgresql://exporter:exporter@postgres-b:5432/postgres?sslmode=disable"
    command: ["--extend.query-path=/etc/pg-exporter/queries.yaml"]
    volumes:
      - ./infra/postgres/exporter/queries.yaml:/etc/pg-exporter/queries.yaml:ro
    depends_on:
      postgres-b: {condition: service_healthy}
    networks: [region-b, edge]

  k6:                            # docker compose --profile load run --rm k6
    image: grafana/k6:0.55.0
    container_name: mr-k6
    profiles: ["load"]
    command: run -o experimental-prometheus-rw /scripts/load.js
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: "p(95),p(99),avg,max"
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 2s
      BASE_URL: ${BASE_URL:-http://mr-haproxy:8080}
      REGION_A_URL: ${REGION_A_URL:-http://mr-service-a:8080}
      REGION_B_URL: ${REGION_B_URL:-http://mr-service-b:8080}
      WRITE_RATE: ${WRITE_RATE:-20}
      READ_RATE: ${READ_RATE:-30}
      VERIFY_RATE: ${VERIFY_RATE:-2}
      DURATION: ${DURATION:-30m}
    volumes: ["./k6:/scripts:ro"]
    depends_on: [haproxy, prometheus]
    networks: [edge]

networks:
  region-a: {name: mr-region-a}
  region-b: {name: mr-region-b}
  wan:      {name: mr-wan}
  edge:     {name: mr-edge}

volumes:
  postgres-a-data: {name: mr-postgres-a-data}
  postgres-b-data: {name: mr-postgres-b-data}
  redpanda-a-data: {name: mr-redpanda-a-data}
  redpanda-b-data: {name: mr-redpanda-b-data}
