global
    log stdout format raw local0
    maxconn 4096

defaults
    mode http
    log global
    timeout connect 2s
    timeout client  15s
    timeout server  15s
    option redispatch
    retries 1

# Docker's embedded DNS: lets HAProxy start even if a region is down and pick it up when it returns
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 1s
    hold other 1s
    hold nx    1s

# ---- :8080  ACTIVE-ACTIVE: both regions take traffic, unhealthy ones are removed ----
frontend fe_active_active
    bind *:8080
    default_backend be_active_active

backend be_active_active
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health
    http-check expect status 200
    default-server inter 1s fall 2 rise 2 resolvers docker init-addr last,libc,none
    server region-a service-a:8080 check
    server region-b service-b:8080 check

# ---- :8090  FAILOVER: region A is primary, B only receives traffic when A is unhealthy.
#      Failback is automatic as soon as A passes `rise` health checks again. ----
frontend fe_failover
    bind *:8090
    default_backend be_failover

backend be_failover
    option httpchk
    http-check send meth GET uri /health
    http-check expect status 200
    default-server inter 1s fall 2 rise 2 resolvers docker init-addr last,libc,none
    server region-a service-a:8080 check
    server region-b service-b:8080 check backup

# ---- :8404  stats UI (admin: drain/maint a region by hand = controlled failback) + /metrics ----
frontend fe_stats
    bind *:8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 2s
    stats admin if TRUE
